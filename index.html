 
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOR AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      text-align: center;
      padding: 60px 20px;
    }
    .logo {
      color: #66e3ff;
      font-size: 48px;
      font-weight: bold;
    }
    .card {
      max-width: 600px;
      margin: 35px auto;
      padding: 25px;
      background: #171f35;
      border-radius: 20px;
    }
    input {
      width: 90%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 10px;
      border: 0;
      font-size: 16px;
    }
    button {
      padding: 13px 25px;
      background: #66e3ff;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    footer {
      color: #aab4cc;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="logo">MOR AI</div>
  <h1>مرحباً بك في MOR</h1>
  <p>مساحتك الجديدة للذكاء الاصطناعي</p>

  <div class="card">
    <h2>كيف يمكنني مساعدتك؟</h2>
    <input id="question" type="text"
      placeholder="اكتب سؤالك هنا...">
    <br>
    <button onclick="askMOR()">إرسال</button>
    <p id="answer">أهلاً بك! اكتب سؤالك للبدء.</p>
  </div>

  <footer>© 2026 MOR AI</footer>

  <script>
    function askMOR() {
      const q = document.getElementById("question").value.trim();
      const answer = document.getElementById("answer");
      if (!q) {
        answer.textContent = "اكتب سؤالك أولاً.";
        return;
      }
      answer.textContent =
        "شكراً على سؤالك! الاتصال بمحرك ذكاء اصطناعي يحتاج إلى إعداد إضافي.";
    }
  </script>
</body>
</html>
